<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="DIDIM 계단 계산기 — 층고만 넣으면 단수·단높이·단너비와 개구부를 계산하고 손스케치 평면·단면으로 보여 줍니다.">
<link rel="icon" href="../img/didim.png">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>DIDIM 계단 계산기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Pen+Script&display=swap">
<style>
/* 레이아웃: 왼쪽 입력 · 결과표 / 오른쪽 큰 단면 스케치 (좁으면 한 줄로 쌓임). 흑백 미니멀, 입력 칸만 옅은 회색 */
:root {
  --bg: #FFFFFF; --fg: #111111; --sub: #6B6B6B; --faint: #9A9A9A;
  --line: #E5E5E5; --hair: #F0F0F0; --input: #F1F1EF; --mass: #EDEDED;
  --dash: #8A8A8A; --dim: #555555; --bad: #B3261E; --onfg: #FFFFFF;
  --sans: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --hand: "Nanum Pen Script", "Noto Sans KR", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141414; --fg: #EDEDEA; --sub: #A3A3A0; --faint: #7A7A77;
  --line: #2E2E2C; --hair: #242423; --input: #232322; --mass: #2B2B29;
  --dash: #8C8C89; --dim: #B5B5B2; --bad: #F2786A; --onfg: #141414; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141414; --fg: #EDEDEA; --sub: #A3A3A0; --faint: #7A7A77;
  --line: #2E2E2C; --hair: #242423; --input: #232322; --mass: #2B2B29;
  --dash: #8C8C89; --dim: #B5B5B2; --bad: #F2786A; --onfg: #141414; color-scheme: dark }

[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid var(--fg); }
.brand small { display: block; font-size: 12px; letter-spacing: 2px; color: var(--sub); }
.brand h1 { margin: 6px 0 0; font-size: 28px; font-weight: 700; text-wrap: balance; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tabs, .seg { display: flex; border: 1px solid var(--fg); border-radius: 4px; overflow: hidden; }
.tabs button, .seg button { padding: 7px 14px; min-height: 34px; font-size: 13px; }
.tabs button[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--fg); color: var(--onfg); }
.chip { padding: 0 12px; min-height: 34px; border: 1px solid var(--line); border-radius: 17px; font-size: 13px; }

.grid { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 40px; padding-top: 28px; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); gap: 24px; } }
.col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

.rowhead { display: flex; justify-content: space-between; align-items: center; }
.rowhead h2 { margin: 0; font-size: 20px; font-weight: 700; }
.step { display: flex; align-items: center; gap: 4px; min-height: 52px; border-bottom: 1px solid var(--hair); }
.step .lab { flex: 1; min-width: 0; color: var(--sub); font-size: 14px; }
.step .lab small { display: block; font-size: 11px; color: var(--faint); }
.step .pm { width: 40px; height: 40px; font-size: 20px; border-radius: 8px; }
.step .pm:disabled { color: var(--line); cursor: default; }
.step .val { display: flex; align-items: center; justify-content: center; gap: 4px; width: 128px; height: 40px; background: var(--input); border-radius: 8px; border: 1px solid transparent; }
.step .val:focus-within { border-color: var(--fg); }
.step input { width: 64px; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 17px; text-align: right; outline: none; font-variant-numeric: tabular-nums; }
.step .unit { color: var(--sub); font-size: 13px; min-width: 22px; }
.link { align-self: flex-start; font-size: 12px; color: var(--sub); text-decoration: underline; min-height: 32px; }
.err { color: var(--bad); font-size: 13px; }

.summary { display: flex; flex-direction: column; gap: 2px; padding: 18px 0; border-top: 1px solid var(--fg); border-bottom: 1px solid var(--line); }
.summary b { font-size: 44px; letter-spacing: -1px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.summary span { font-size: 15px; font-variant-numeric: tabular-nums; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
td { padding: 11px 0; border-bottom: 1px solid var(--hair); }
td.v { text-align: right; color: var(--sub); padding-right: 12px; }
td.t { text-align: right; width: 82px; font-size: 12px; color: var(--faint); }
td.t.ok { color: var(--fg); font-weight: 500; }
td.t.bad { color: var(--bad); font-weight: 500; }
.note { font-size: 11.5px; line-height: 1.7; color: var(--sub); max-width: 62ch; margin: 0; }

.sketch { width: 100%; max-width: 100%; aspect-ratio: 334 / 250; }
.sketch.plan { aspect-ratio: 334 / 290; }
.getapp { display: flex; gap: 18px; align-items: center; padding: 16px 0; border-top: 1px solid var(--line); color: var(--fg); text-decoration: none; }
.getapp .qr { flex: none; width: 96px; height: 96px; padding: 8px; background: #FFFFFF; color: #111111; border: 1px solid var(--line); border-radius: 8px; }
.getapp .qr svg { width: 100%; height: 100%; display: block; }
.getapp .ga-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.getapp b { font-size: 15px; }
.getapp small { font-size: 12px; color: var(--sub); line-height: 1.5; }
.getapp .ga-btn { align-self: flex-start; margin-top: 6px; padding: 6px 12px; border: 1px solid var(--fg); border-radius: 17px; font-size: 12px; }
@media (max-width: 600px) { .getapp .qr { display: none; } }
.sketch.two { aspect-ratio: auto; display: flex; flex-direction: column; gap: 8px; }
.sketch.two svg { height: auto; aspect-ratio: 334 / 250; }
.seg.shape { width: 100%; }
.seg.shape button { flex: 1; }
.seg.shape button + button { border-left: 1px solid var(--fg); }
.views { display: flex; gap: 6px; }
.views .chip[aria-pressed="true"] { background: var(--fg); color: var(--onfg); border-color: var(--fg); }
.step .val.ro { justify-content: center; font-size: 17px; font-variant-numeric: tabular-nums; }
.sketch svg { width: 100%; height: 100%; display: block; }
.recent { display: flex; flex-direction: column; }
.recent h3 { margin: 0 0 4px; font-size: 12px; font-weight: 400; color: var(--sub); }
.recent button { display: flex; justify-content: space-between; gap: 12px; min-height: 38px; border-bottom: 1px solid var(--hair); text-align: left; font-variant-numeric: tabular-nums; }
.recent button span:last-child { color: var(--sub); }

.page { max-width: 720px; padding-top: 28px; display: flex; flex-direction: column; gap: 26px; }
.hero { padding: 22px 0; border-top: 1px solid var(--fg); display: flex; flex-direction: column; gap: 12px; }
.hero .k { font-size: 12px; color: var(--sub); }
.hero .f { font-size: 40px; font-weight: 500; letter-spacing: -0.5px; }
.hero p, .card p { margin: 0; line-height: 1.75; color: var(--fg); opacity: .88; max-width: 62ch; }
.card { padding: 16px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.card .h { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.card .h b { font-size: 15px; }
.card .h span { color: var(--sub); font-variant-numeric: tabular-nums; }
.card .src { font-size: 11px; color: var(--faint); }
.code dl { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: 13px; }
.code dt { color: var(--sub); }
.code dd { margin: 0; }
@media (prefers-reduced-motion: no-preference) { .sketch path { transition: d .25s ease; } }
</style>

<script>
(() => {
  // ---------- 상태 ----------
  const DEF = { H: 3400, floor: 1000, mode: 'auto', adj: 0, nM: 20, lM: 290, hr: 2100, li: 3000, ll: 1200,
    shape: 'straight', w: 1200, gap: 100, split: 0, view: null,
    lang: (navigator.language || 'ko').startsWith('ko') ? 'ko' : 'en', imp: false, tab: 'calc', adv: false, recent: [] };
  let S = Object.assign({}, DEF);
  try { const saved = JSON.parse(localStorage.getItem('didim-web') || 'null'); if (saved) S = Object.assign(S, saved); } catch (e) {}
  const save = () => { try { localStorage.setItem('didim-web', JSON.stringify(S)); } catch (e) {} };
  const L = (ko, en) => S.lang === 'en' ? en : ko;
  const $ = (id) => document.getElementById(id);

  // ---------- 계산 (앱과 같은 식) ----------
  const STRIDE = [590, 650], ANG = [22, 45];
  const autoBase = (H) => Math.max(2, Math.round(H / 170));
  const autoBounds = (H) => { const lo = Math.max(2, Math.ceil(H / 250)); return [lo, Math.max(lo, Math.floor(H / 100))]; };
  const manBounds = (H) => { const lo = Math.max(2, Math.ceil(H / 300)); return [lo, Math.max(lo, Math.min(80, Math.floor(H / 80)))]; };
  const autoTread = (h) => Math.min(500, Math.max(200, Math.ceil((630 - 2 * h) / 5 - 1e-9) * 5));
  const splitSteps = (n, sp) => { const n1 = Math.min(n - 2, Math.max(2, Math.floor((n + 1) / 2) + sp)); return [n1, n - n1]; };
  const autoSteps = () => { const b = autoBounds(S.H); return Math.min(b[1], Math.max(b[0], autoBase(S.H) + S.adj)); };

  function solve() {
    const H = S.H;
    if (!(H >= 300 && H <= 10000)) return { err: L('층고는 300~10,000 mm 사이로 입력하세요.', 'Enter a floor height between 300 and 10,000 mm.') };
    if (!(S.floor >= 0 && S.floor < H)) return { err: L('바닥 총두께는 층고보다 작아야 합니다.', 'The floor build-up must be less than the floor height.') };
    let n, h, l;
    if (S.mode === 'manual') {
      n = Math.round(S.nM); l = S.lM;
      if (!(n >= 2 && n <= 80)) return { err: L('단수는 2~80 사이로 입력하세요.', 'Enter between 2 and 80 steps.') };
      h = H / n;
      if (!(h >= 80 && h <= 300)) return { err: L('단높이가 ' + h.toFixed(1) + ' mm입니다. 단수를 조정하세요.', 'Riser is ' + h.toFixed(1) + ' mm. Adjust the number of steps.') };
      if (!(l >= 150 && l <= 600)) return { err: L('단너비는 150~600 mm 사이로 입력하세요.', 'Enter a tread between 150 and 600 mm.') };
    } else { n = autoSteps(); h = H / n; l = autoTread(h); }
    const every = Math.max(500, S.li), W0 = Math.max(300, S.w), GAP = Math.max(0, S.gap);
    let LAND = Math.max(300, S.ll || 1200);
    let landings = 0, after = new Set(), starts = [1], n1 = n, n2 = 0;
    if (S.shape === 'straight') {
      while (landings < n - 1 && Math.floor((n + landings) / (landings + 1)) * h > every + 0.5) landings++;
      let cum = 0;
      for (let j = 0; j < landings; j++) { cum += Math.floor(n / (landings + 1)) + (j < n % (landings + 1) ? 1 : 0); after.add(cum); starts.push(cum + 1); }
    } else {
      // 꺾이는 곳에 계단참 하나 (ㄱ자는 폭 × 폭, U자는 입력한 길이)
      if (n < 4) return { err: L('꺾인 계단은 4단 이상이어야 합니다. 층고나 단수를 늘리세요.', 'A turning stair needs at least 4 steps. Increase the height or steps.') };
      [n1, n2] = splitSteps(n, S.split);
      landings = 1; after = new Set([n1]); starts = [1, n1 + 1];
      if (S.shape === 'l') LAND = W0;
    }
    const rx = new Array(n + 1).fill(0);
    for (let i = 1; i < n; i++) rx[i + 1] = rx[i] + (after.has(i) ? LAND : l);
    const run = rx[n];
    const prof = [[0, 0]];
    for (let i = 1; i <= n; i++) { prof.push([rx[i], i * h]); if (after.has(i)) prof.push([rx[i + 1], i * h]); }
    const thr = H - S.floor - S.hr; let xc = run;
    if (thr < 0) xc = 0; else for (let k = 1; k < prof.length; k++) {
      const a = prof[k - 1], b = prof[k];
      if (b[1] > a[1] && thr >= a[1] && thr <= b[1]) { xc = a[0] + (thr - a[1]) / (b[1] - a[1]) * (b[0] - a[0]); break; }
    }
    const ends = starts.slice(1).map((x) => x - 1).concat([n]);
    const maxRise = Math.max(...starts.map((st, k) => ends[k] - st + 1)) * h;
    const runA = Math.max(0, n1 - 1) * l, runB = Math.max(0, n2 - 1) * l;
    let fW, fL;
    if (S.shape === 'straight') { fW = run; fL = W0; }
    else if (S.shape === 'l') { fW = runA + W0; fL = W0 + runB; }
    else { fW = 2 * W0 + GAP; fL = Math.max(runA, runB) + LAND; }
    return { H, n, h, l, landings, after, starts, rx, prof, run, xc, opening: Math.max(0, run - xc),
      stride: 2 * h + l, conv: l - h, safe: l + h, ang: Math.atan(h / l) * 180 / Math.PI,
      shape: S.shape, n1, n2, w: W0, gap: S.shape === 'u' ? GAP : 0, turn: S.shape === 'straight' ? 0 : LAND,
      runA, runB, fW, fL, maxRise, over: maxRise > every + 0.5 };
  }

  // ---------- 단위 ----------
  const IN = 25.4;
  const grp = (v) => Math.round(v).toLocaleString('en-US');
  const len = (mm) => S.imp ? (mm / IN).toFixed(1) : grp(mm);
  const fine = (mm) => S.imp ? (mm / IN).toFixed(2) : (Math.round(mm * 10) / 10).toString();
  const sgn = (mm) => { const v = S.imp ? Math.round(mm / IN * 10) / 10 : Math.round(mm); return v === 0 ? '0' : (v > 0 ? '+' : '−') + (S.imp ? Math.abs(v).toFixed(1) : grp(Math.abs(v))); };
  const uName = () => S.imp ? 'in' : 'mm';

  // ---------- 입력 줄 ----------
  function stepper(host, cfg) {
    const row = document.createElement('div'); row.className = 'step';
    row.innerHTML = '<div class="lab"></div><button class="pm" type="button">−</button><label class="val"><input type="text" inputmode="decimal" autocomplete="off"><span class="unit"></span></label><button class="pm" type="button">+</button>';
    const [lab, minus, , plus] = row.children; const input = row.querySelector('input'); const unit = row.querySelector('.unit');
    input.id = 'in-' + cfg.key; input.setAttribute('aria-label', cfg.key);
    host.appendChild(row);
    const scale = () => cfg.unitless ? 1 : (S.imp ? IN : 1);
    const digits = () => cfg.unitless ? 0 : (S.imp ? (cfg.key === 'lM' ? 2 : 1) : 0);
    const stepMM = () => cfg.unitless ? 1 : (S.imp ? cfg.stepIn * IN : cfg.step);
    const show = () => { const v = cfg.get() / scale(); input.value = digits() ? v.toFixed(digits()) : String(Math.round(v)); };
    const refresh = () => {
      lab.innerHTML = cfg.label() + (cfg.note ? '<small>' + cfg.note() + '</small>' : '');
      unit.textContent = cfg.unitless ? '' : uName();
      if (document.activeElement !== input) show();
      const v = cfg.get(), [lo, hi] = cfg.range();
      minus.disabled = v <= lo + 1e-6; plus.disabled = v >= hi - 1e-6;
      minus.setAttribute('aria-label', cfg.label() + ' −'); plus.setAttribute('aria-label', cfg.label() + ' +');
    };
    const bump = (sign) => {
      const st = stepMM(), q = cfg.get() / st;
      const next = sign > 0 ? (Math.floor(q + 1e-6) + 1) * st : (Math.ceil(q - 1e-6) - 1) * st;
      const [lo, hi] = cfg.range(); cfg.set(Math.min(hi, Math.max(lo, next))); render();
    };
    minus.onclick = () => bump(-1); plus.onclick = () => bump(1);
    input.oninput = () => { const v = parseFloat(input.value.replace(',', '.')); if (!isNaN(v)) { cfg.set(v * scale()); render(true); } };
    input.onblur = () => { show(); };
    input.onkeydown = (e) => { if (e.key === 'Enter') input.blur(); };
    return refresh;
  }

  const rows = [];
  const steps = $('steps'), adv = $('advSteps');
  rows.push(stepper(steps, { key: 'H', label: () => L('층고', 'Floor height'), get: () => S.H, set: (v) => { S.H = v; S.adj = 0; }, step: 10, stepIn: 0.5, range: () => [300, 10000] }));
  rows.push(stepper(steps, { key: 'floor', label: () => L('바닥 총두께', 'Floor build-up'), note: () => L('마감 + 슬래브 + 천장반자', 'Finish + slab + ceiling'), get: () => S.floor, set: (v) => { S.floor = v; }, step: 10, stepIn: 0.5, range: () => [0, 3000] }));

      arrow = [P(l * .3, w / 2), P(W - l * .4, w / 2)]; up = [P(l * .3, 0)[0] + 4, P(0, w)[1] - 11];
      dims = hd(P(0, 0)[0], P(W, 0)[0], bottom + 16).concat(vd(P(0, 0)[0] - 16, bottom, P(0, w)[1]));
      wAt = [P(W / 2, 0)[0], bottom + 34]; lAt = [P(0, 0)[0] - 29, P(0, w / 2)[1]];
    } else if (r.shape === 'l') {
      const A = r.runA, B = r.runB;
      outline = [P(0, 0), P(W, 0), P(W, Lm), P(A, Lm), P(A, w), P(0, w), P(0, 0)]; lands = [rect(A, 0, W, w)];
      for (let k = 0; k < r.n1; k++) { const x = k * l; treads.push([P(x, 0), P(x, w)]); }
      for (let k = 0; k < r.n2; k++) { const y = w + k * l; treads.push([P(A, y), P(W, y)]); }
      arrow = [P(l * .3, w / 2), P(A + w / 2, w / 2), P(A + w / 2, w + B - l * .4)]; up = [P(0, 0)[0] - 16, P(0, w / 2)[1]];
      if (w * sc >= 56) labs.push([P(A + w / 2, 0)[0], P(0, w / 2)[1] + 16]);
      dims = hd(P(0, 0)[0], P(W, 0)[0], bottom + 16).concat(vd(P(W, 0)[0] + 18, bottom, P(0, Lm)[1]));
      wAt = [P(W / 2, 0)[0], bottom + 34]; lAt = [P(W, 0)[0] + 34, P(0, Lm / 2)[1]];
    } else {
      const A = r.runA, B = r.runB, top = Lm - r.turn, xa = w + r.gap;
      outline = rect(0, 0, W, Lm).concat([P(0, 0)]); lands = [rect(0, top, W, Lm)];
      for (let k = 0; k < r.n1; k++) { const y = top - A + k * l; treads.push([P(xa, y), P(W, y)]); }
      for (let k = 0; k < r.n2; k++) { const y = top - k * l; treads.push([P(0, y), P(w, y)]); }
      treads.push([P(0, top), P(W, top)]); // 계단참 경계: 두 구간 사이 틈까지 끊김 없이
      voids = r.gap > 0 ? [[P(w, top - B), P(w, top)], [P(xa, top - A), P(xa, top)]] : [[P(w, top - Math.max(A, B)), P(w, top)]];
      const ya = top - A + l * .3;
      arrow = [P(xa + w / 2, ya), P(xa + w / 2, top + r.turn / 2), P(w / 2, top + r.turn / 2), P(w / 2, top - B + l * .4)];
      up = [P(W, 0)[0] + 16, P(0, ya)[1]];
      labs.push([P(W / 2, 0)[0], r.turn * sc >= 56 ? P(0, top + r.turn / 2)[1] - 11 : P(0, Lm)[1] - 10]);
      dims = hd(P(0, 0)[0], P(W, 0)[0], bottom + 16).concat(vd(P(0, 0)[0] - 18, bottom, P(0, Lm)[1]));
      wAt = [P(W / 2, 0)[0], bottom + 34]; lAt = [P(0, 0)[0] - 31, P(0, Lm / 2)[1]];
    }
    const many = (a) => a.map(pts).join(' ');
    const b = arrow[arrow.length - 1], a = arrow[arrow.length - 2], ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    const head = [-1, 1].map((sg) => { const t = ang + Math.PI + sg * Math.PI / 6; return 'M' + f(b[0]) + ' ' + f(b[1]) + ' L' + f(b[0] + 6 * Math.cos(t)) + ' ' + f(b[1] + 6 * Math.sin(t)); }).join(' ');
    const txt = (p, s, size, fill, rot) => '<text x="' + f(p[0]) + '" y="' + f(p[1]) + '" text-anchor="middle" dominant-baseline="central" font-size="' + size + '" fill="' + fill + '"' + (rot ? ' transform="rotate(-90 ' + f(p[0]) + ' ' + f(p[1]) + ')"' : '') + '>' + s + '</text>';
    return '<svg viewBox="0 0 334 290" role="img" aria-label="' + L('계단 평면 스케치', 'Stair plan sketch') + '">' +
      '<defs><filter id="roughP" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter></defs>' +
      '<g filter="url(#roughP)" fill="none" stroke-linecap="round" stroke-linejoin="round">' +
      lands.map((q) => '<path d="' + pts(q) + ' Z" fill="var(--mass)" stroke="none"/>').join('') +
      '<path d="' + many(treads) + '" stroke="var(--fg)" stroke-width="0.9"/>' +
      (voids.length ? '<path d="' + many(voids) + '" stroke="var(--fg)" stroke-width="1"/>' : '') +
      '<path d="' + pts(outline) + '" stroke="var(--fg)" stroke-width="1.6"/>' +
      '<path d="' + many(dims) + '" stroke="var(--dim)" stroke-width="0.9"/>' +
      '</g>' +
      '<path d="' + pts(arrow) + ' ' + head + '" fill="none" stroke="var(--fg)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle cx="' + f(arrow[0][0]) + '" cy="' + f(arrow[0][1]) + '" r="2.5" fill="var(--fg)"/>' +
      '<g font-family="Nanum Pen Script, cursive">' +
      txt(up, 'UP', 17, 'var(--fg)') +
      labs.map((p) => txt(p, L('계단참', 'landing'), 16, 'var(--sub)')).join('') +
      txt(wAt, len(W), 18, 'var(--dim)') + txt(lAt, len(Lm), 18, 'var(--dim)', true) +
      '</g></svg>';
  }

  let recentTimer;
  function remember(r) {
    clearTimeout(recentTimer);

      const turn = r.shape !== 'straight';
      const item = { H: S.H, floor: S.floor, n: r.n, h: r.h, l: r.l, shape: r.shape, w: r.w, gap: r.shape === 'u' ? r.gap : null, split: turn ? r.n1 - Math.floor((r.n + 1) / 2) : null };
      const same = (x) => Math.abs(x.H - item.H) < .5 && x.n === item.n && Math.abs(x.l - item.l) < .5 && Math.abs(x.floor - item.floor) < .5
        && (x.shape || 'straight') === item.shape && Math.abs((x.w || 1200) - item.w) < .5 && (x.split ?? null) === item.split && (x.gap ?? null) === item.gap;
      S.recent = [item].concat((S.recent || []).filter((x) => !same(x))).slice(0, 10);
      save(); drawRecent();
    }, 1500);
  }

    c.fillText(shp + ' · ' + L('층고 ', 'H ') + len(S.H) + ' · ' + L(r.n + '단', r.n + ' steps') + ' · ' + fine(r.h) + ' / ' + fine(r.l) + ' ' + uName(), pad, pad + 14 * k);
    let y = pad + head;
    for (const [im, h] of ims) { c.drawImage(im, pad, y, W, h); y += h + 8 * k; }
    return await new Promise((res) => cv.toBlob(res, 'image/png'));
  }
  let downloads = null;
  (async () => {
    try { downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { downloads = null; }
    // Claude 화면이 아닌 일반 웹페이지에서는 브라우저가 바로 저장
    if (!downloads && !window.claude) downloads = { save: async ({ filename, data }) => { const a = document.createElement('a'); a.href = URL.createObjectURL(data); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); } };
    $('saveImg').hidden = !downloads;
  })();
  $('saveImg').onclick = async () => {
    if (!downloads) return;
    const b = $('saveImg'); b.disabled = true;
    try {
      const blob = await sketchPng();
      const kind = $('sketch').classList.contains('plan') ? L('평면', 'plan') : L('단면', 'section');
      await downloads.save({ filename: 'DIDIM-' + kind + '.png', data: blob });
    } catch (e) { /* 저장을 취소했거나 이 화면에서 쓸 수 없음 */ }
    b.disabled = false;
  };

  // ---------- 버튼 ----------
  ['calc', 'theory', 'codes'].forEach((k) => { $('tab-' + k).onclick = () => { S.tab = k; render(); }; });
  $('m-auto').onclick = () => { S.mode = 'auto'; render(); };
  $('m-manual').onclick = () => { if (S.mode !== 'manual') { const r = solve(); if (!r.err) { S.nM = r.n; S.lM = r.l; } S.mode = 'manual'; } render(); };
  ['straight', 'l', 'u'].forEach((k) => { $('s-' + k).onclick = () => { if (S.shape !== k) { S.shape = k; S.split = 0; S.view = null; } render(); }; });
  $('v-plan-btn').onclick = () => { S.view = 'plan'; render(); };
  $('v-sec-btn').onclick = () => { S.view = 'section'; render(); };
  $('advBtn').onclick = () => { S.adv = !S.adv; render(); };
  $('unitBtn').onclick = () => { S.imp = !S.imp; render(); };
  $('langBtn').onclick = () => { S.lang = S.lang === 'ko' ? 'en' : 'ko'; render(); };

  render();
})();
</script>
